name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Confirm built-in SQLite runtime
        run: node -e "const { DatabaseSync } = require('node:sqlite'); const database = new DatabaseSync(':memory:'); database.close();"
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: npm run verify
